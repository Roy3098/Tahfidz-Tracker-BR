<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="512" height="512">
  <defs>
    <!-- Main Squircle Background Gradient -->
    <linearGradient id="bgGrad" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#359668" />
      <stop offset="35%" stop-color="#196b47" />
      <stop offset="75%" stop-color="#0a452e" />
      <stop offset="100%" stop-color="#052b1d" />
    </linearGradient>

    <!-- Inner Dome Green Gradient -->
    <linearGradient id="domeInnerGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#48a868" />
      <stop offset="55%" stop-color="#28824e" />
      <stop offset="100%" stop-color="#155d37" />
    </linearGradient>

    <!-- Dome Cream Outline Gradient -->
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffdf4" />
      <stop offset="100%" stop-color="#efe5ce" />
    </linearGradient>

    <!-- Checklist Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffdf5" />
      <stop offset="75%" stop-color="#f7eed8" />
      <stop offset="100%" stop-color="#e5d8bc" />
    </linearGradient>

    <!-- Left Page Gradient -->
    <linearGradient id="pageLeftGrad" x1="0%" y1="0%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="#fffdf7" />
      <stop offset="75%" stop-color="#fbf4e3" />
      <stop offset="100%" stop-color="#e2d5bb" />
    </linearGradient>

    <!-- Right Page Gradient -->
    <linearGradient id="pageRightGrad" x1="100%" y1="0%" x2="0%" y2="30%">
      <stop offset="0%" stop-color="#fbf4e4" />
      <stop offset="75%" stop-color="#f3e8d0" />
      <stop offset="100%" stop-color="#d7c8ab" />
    </linearGradient>

    <!-- Wood Stand Gradients -->
    <linearGradient id="woodLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c67d43" />
      <stop offset="50%" stop-color="#9e5624" />
      <stop offset="100%" stop-color="#753b13" />
    </linearGradient>

    <linearGradient id="woodDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b471b" />
      <stop offset="100%" stop-color="#58290b" />
    </linearGradient>

    <!-- Text "Tracker" Mint Green Gradient -->
    <linearGradient id="trackerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#84eb95" />
      <stop offset="100%" stop-color="#52c46d" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#021a10" flood-opacity="0.45" />
    </filter>
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#021a10" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="url(#bgGrad)" />

  <!-- Subtle Top-Left Ambient Highlight -->
  <radialGradient id="topGlow" cx="25%" cy="18%" r="55%">
    <stop offset="0%" stop-color="#5cd696" stop-opacity="0.22" />
    <stop offset="100%" stop-color="#5cd696" stop-opacity="0" />
  </radialGradient>
  <rect x="24" y="24" width="976" height="976" rx="220" fill="url(#topGlow)" />

  <!-- ================= ISLAMIC POINTED DOME / ARCH (MIHRAB) ================= -->
  <g filter="url(#dropShadow)">
    <!-- Outer Cream Arch Frame -->
    <path
      d="M 512 96
         C 548 142, 600 176, 650 198
         C 700 220, 734 260, 738 318
         C 766 340, 778 378, 774 426
         L 774 480
         L 250 480
         L 250 426
         C 246 378, 258 340, 286 318
         C 290 260, 324 220, 374 198
         C 424 176, 476 142, 512 96 Z"
      fill="url(#creamGrad)"
    />
    <!-- Inner Green Dome Area -->
    <path
      d="M 512 136
         C 544 174, 590 204, 634 223
         C 678 242, 706 276, 710 326
         C 735 346, 745 378, 742 420
         L 742 468
         L 282 468
         L 282 420
         C 279 378, 289 346, 314 326
         C 318 276, 346 242, 390 223
         C 434 204, 480 174, 512 136 Z"
      fill="url(#domeInnerGrad)"
    />
    <!-- Inner Decorative Arch Line -->
    <path
      d="M 512 158
         C 541 192, 583 219, 623 236
         C 663 253, 688 284, 692 330
         C 714 348, 723 376, 720 415"
      fill="none"
      stroke="#5cc480"
      stroke-width="6"
      stroke-opacity="0.35"
      stroke-linecap="round"
    />
    <path
      d="M 512 158
         C 483 192, 441 219, 401 236
         C 361 253, 336 284, 332 330
         C 310 348, 301 376, 304 415"
      fill="none"
      stroke="#5cc480"
      stroke-width="6"
      stroke-opacity="0.35"
      stroke-linecap="round"
    />
  </g>

  <!-- ================= CHECKLIST CARD INSIDE ARCH ================= -->
  <g filter="url(#dropShadow)">
    <rect x="372" y="218" width="280" height="250" rx="34" fill="url(#cardGrad)" />

    <!-- Row 1 Checkmark Circle & Progress Line -->
    <circle cx="426" cy="268" r="22" fill="#237d4b" />
    <path d="M 415 268 L 423 276 L 438 259" fill="none" stroke="#fffdf5" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="466" y="260" width="140" height="16" rx="8" fill="#237d4b" />

    <!-- Row 2 Checkmark Circle & Progress Line -->
    <circle cx="426" cy="322" r="22" fill="#237d4b" />
    <path d="M 415 322 L 423 330 L 438 313" fill="none" stroke="#fffdf5" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="466" y="314" width="140" height="16" rx="8" fill="#237d4b" />

    <!-- Row 3 Checkmark Circle & Progress Line -->
    <circle cx="426" cy="376" r="22" fill="#237d4b" />
    <path d="M 415 376 L 423 384 L 438 367" fill="none" stroke="#fffdf5" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="466" y="368" width="140" height="16" rx="8" fill="#237d4b" />
  </g>

  <!-- ================= WOODEN REHAL (QURAN STAND) & OPEN QURAN ================= -->
  <g filter="url(#dropShadow)">
    <!-- Back/Under Wooden Legs (X-Stand) -->
    <!-- Left-to-Right Leg -->
    <path
      d="M 234 480
         L 256 458
         L 512 562
         L 768 458
         L 790 480
         L 764 512
         L 566 592
         L 764 624
         L 754 662
         L 512 598
         L 270 662
         L 260 624
         L 458 592
         L 260 512 Z"
      fill="url(#woodDark)"
    />

    <!-- Front Sculpted Wooden Rehal Arms & Legs -->
    <!-- Left Wooden Cradle & Right Leg -->
    <path
      d="M 236 468
         C 232 478, 236 492, 248 498
         L 452 586
         L 264 622
         C 256 626, 254 648, 264 660
         L 490 598
         C 504 595, 520 595, 534 598
         L 760 660
         C 770 648, 768 626, 760 622
         L 572 586
         L 776 498
         C 788 492, 792 478, 788 468
         L 512 574 Z"
      fill="url(#woodLight)"
    />

    <!-- Highlight Bevels on Wooden Stand -->
    <path
      d="M 262 624 L 444 548 L 466 560 L 266 654 Z"
      fill="#c98046"
      opacity="0.65"
    />
    <path
      d="M 762 624 L 580 548 L 558 560 L 758 654 Z"
      fill="#733912"
      opacity="0.7"
    />

    <!-- Green Quran Hardcover Base -->
    <path
      d="M 252 454
         L 310 392
         L 512 496
         L 714 392
         L 772 454
         L 768 470
         L 546 562
         C 534 584, 490 584, 478 562
         L 256 470 Z"
      fill="#125534"
    />
    <!-- Bright Green Cover Edge Left & Right -->
    <path d="M 252 454 L 312 390 L 336 398 L 280 464 Z" fill="#46ae66" />
    <path d="M 772 454 L 712 390 L 688 398 L 744 464 Z" fill="#3a9858" />

    <!-- Spine Hollow / Binding U-Shape -->
    <path
      d="M 476 538
         C 482 574, 542 574, 548 538
         L 538 532
         C 532 558, 492 558, 486 532 Z"
      fill="#1b6b42"
    />
    <ellipse cx="512" cy="540" rx="26" ry="12" fill="#08331e" />

    <!-- Lower Page Thickness Stack (Left) -->
    <path
      d="M 282 460
         C 340 468, 434 494, 498 536
         L 512 522
         L 304 434
         Z"
      fill="#dfd3b9"
    />
    <!-- Lower Page Thickness Stack (Right) -->
    <path
      d="M 742 460
         C 684 468, 590 494, 526 536
         L 512 522
         L 720 434
         Z"
      fill="#d3c5a8"
    />

    <!-- Main Open Left Page -->
    <path
      d="M 340 382
         C 396 386, 464 414, 512 454
         L 512 532
         C 462 492, 372 462, 286 446
         C 282 444, 280 438, 284 432
         L 328 386
         C 332 382, 336 382, 340 382 Z"
      fill="url(#pageLeftGrad)"
    />

    <!-- Main Open Right Page -->
    <path
      d="M 684 382
         C 628 386, 560 414, 512 454
         L 512 532
         C 562 492, 652 462, 738 446
         C 742 444, 744 438, 740 432
         L 696 386
         C 692 382, 688 382, 684 382 Z"
      fill="url(#pageRightGrad)"
    />

    <!-- Center Book Fold Line -->
    <line x1="512" y1="452" x2="512" y2="534" stroke="#cbbba0" stroke-width="4" />

    <!-- Subtle Verse Lines on Left Page -->
    <path d="M 352 406 C 392 414, 436 430, 472 452" fill="none" stroke="#c5d8bc" stroke-width="9" stroke-linecap="round" />
    <path d="M 336 424 C 378 432, 424 448, 462 470" fill="none" stroke="#c5d8bc" stroke-width="9" stroke-linecap="round" />
    <path d="M 320 442 C 364 450, 412 466, 452 488" fill="none" stroke="#c5d8bc" stroke-width="9" stroke-linecap="round" />

    <!-- Subtle Verse Lines on Right Page -->
    <path d="M 672 406 C 632 414, 588 430, 552 452" fill="none" stroke="#" stroke-width="0" />
    <path d="M 672 406 C 632 414, 588 430, 552 452" fill="none" stroke="#bdd1b4" stroke-width="9" stroke-linecap="round" />
    <path d="M 688 424 C 646 432, 600 448, 562 470" fill="none" stroke="#bdd1b4" stroke-width="9" stroke-linecap="round" />
    <path d="M 704 442 C 660 450, 612 466, 572 488" fill="none" stroke="#bdd1b4" stroke-width="9" stroke-linecap="round" />
  </g>

  <!-- ================= BOTTOM TYPOGRAPHY: "Tahfidz" & "— Tracker —" ================= -->
  <g filter="url(#textShadow)">
    <!-- "Tahfidz" in Cream Rounded Bold Font -->
    <text
      x="512"
      y="782"
      text-anchor="middle"
      fill="url(#creamGrad)"
      font-family="'Plus Jakarta Sans', 'Nunito', 'Fredoka', 'Arial Rounded MT Bold', sans-serif"
      font-weight="800"
      font-size="148"
      letter-spacing="-2"
    >
      Tahfidz
    </text>

    <!-- Left Dash -->
    <rect x="234" y="836" width="72" height="14" rx="7" fill="url(#trackerGrad)" />

    <!-- "Tracker" in Mint Green Rounded Bold Font -->
    <text
      x="512"
      y="872"
      text-anchor="middle"
      fill="url(#trackerGrad)"
      font-family="'Plus Jakarta Sans', 'Nunito', 'Fredoka', 'Arial Rounded MT Bold', sans-serif"
      font-weight="800"
      font-size="92"
      letter-spacing="0"
    >
      Tracker
    </text>

    <!-- Right Dash -->
    <rect x="718" y="836" width="72" height="14" rx="7" fill="url(#trackerGrad)" />
  </g>
</svg>
